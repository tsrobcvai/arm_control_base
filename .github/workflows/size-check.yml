name: Enforce total-commit size
on: [push, pull_request]
jobs:
  check-total-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Fail if >10 MB added
        run: |
          threshold=10485760
          total=0
          for f in $(git diff --name-only ${{ github.event.before }} ${{ github.sha }}); do
            [[ -f $f ]] || continue
            total=$(( total + $(wc -c <"$f") ))
          done
          echo "Added size: $total bytes"
          if (( total > threshold )); then
            echo "::error ::Total added size exceeds 10 MB limit."
            exit 1
          fi
